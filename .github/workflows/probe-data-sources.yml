name: probe-data-sources

# 데이터 출처 시험 — Actions 러너(인터넷 제한 없음)에서 공개 자료가 실제로 받아지는지, 이용 조건 문장이 무엇인지 확인합니다.
# 키를 쓰지 않습니다. 결과는 Actions 로그에서 봅니다. 가격 숫자는 로그에 남기지 않도록 머리 부분만 출력합니다.
# main 에 병합된 뒤에는 Actions → probe-data-sources → Run workflow 로만 실행합니다(병합 전에는 이 파일을 고쳐 올릴 때 자동 실행했음).
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: EODHD demo (AAPL.US) — 받아지는지와 마지막 날짜만
        run: |
          curl -sS -m 30 -o eod.json -w "HTTP %{http_code}\n" "https://eodhd.com/api/eod/AAPL.US?api_token=demo&fmt=json&from=2026-10-01" || true
          python3 -I -c 'import json; d=json.load(open("eod.json")); print("rows", len(d), "last date", d[-1]["date"] if d else None)' || head -c 300 eod.json
      - name: EODHD 이용 조건 — display·redistribut·non-commercial 문장
        run: |
          curl -sS -m 30 -L -o terms.html -w "HTTP %{http_code}\n" "https://eodhd.com/financial-apis/terms-conditions" || true
          python3 -I - <<'PY'
          import re, html
          t = open("terms.html", encoding="utf-8", errors="replace").read()
          t = re.sub(r"<script.*?</script>|<style.*?</style>", "", t, flags=re.S)
          t = re.sub(r"<[^>]+>", " ", t); t = html.unescape(t); t = re.sub(r"\s+", " ", t)
          for kw in ["displaying", "redistribut", "non-commercial", "attribution"]:
              for m in list(re.finditer(kw, t, flags=re.I))[:2]:
                  print(f"[{kw}] …{t[max(0,m.start()-250):m.end()+250]}…\n")
          PY
      - name: Twelve Data demo (AAPL) + 이용 조건·요금 페이지의 attribution/display 문장
        run: |
          curl -sS -m 30 -o td.json -w "HTTP %{http_code}\n" "https://api.twelvedata.com/time_series?symbol=AAPL&interval=1day&outputsize=3&adjust=all&apikey=demo" || true
          python3 -I -c 'import json; d=json.load(open("td.json")); print("keys", list(d.keys())); v=d.get("values") or []; print("rows", len(v), "last", v[0]["datetime"] if v else d.get("message"))' || head -c 300 td.json
          for u in "https://twelvedata.com/terms" "https://twelvedata.com/pricing" "https://support.twelvedata.com/en/articles/5194610-attribution"; do
            echo "== $u"
            curl -sS -m 30 -L -A "Mozilla/5.0 (fde-lab learning project)" -o page.html -w "HTTP %{http_code} · %{size_download} bytes\n" "$u" || true
            python3 -I - <<'PY'
          import re, html
          t = open("page.html", encoding="utf-8", errors="replace").read()
          t = re.sub(r"<script.*?</script>|<style.*?</style>", "", t, flags=re.S)
          t = re.sub(r"<[^>]+>", " ", t); t = html.unescape(t); t = re.sub(r"\s+", " ", t)
          print("text chars", len(t))
          for kw in ["attribution", "attribute", "display", "redistribut", "non-commercial", "personal use", "free plan", "Basic plan"]:
              for m in list(re.finditer(kw, t, flags=re.I))[:3]:
                  print(f"[{kw}] …{t[max(0,m.start()-220):m.end()+220]}…\n")
          PY
          done
      - name: 다우 구성 — S&P DJI 보도자료(2026-06-23)에서 Alphabet 티커 확인 + 위키백과 이력 문서 판 번호
        run: |
          UA="fde-lab learning project (GitHub Actions probe)"
          curl -sS -m 30 -L -A "$UA" -o press.html -w "HTTP %{http_code} · %{size_download} bytes\n" "https://press.spglobal.com/2026-06-23-Alphabet-Set-to-Join-and-Honeywell-International-to-Remain-in-Dow-Jones-Industrial-Average" || true
          python3 -I - <<'PY'
          import re, html
          t = open("press.html", encoding="utf-8", errors="replace").read()
          t = re.sub(r"<script.*?</script>|<style.*?</style>", "", t, flags=re.S)
          t = re.sub(r"<[^>]+>", " ", t); t = html.unescape(t); t = re.sub(r"\s+", " ", t)
          print("text chars", len(t))
          for kw in [r"GOOGL?\b", "Alphabet", "Honeywell", "Verizon", "effective", "prior to the open"]:
              for m in list(re.finditer(kw, t))[:3]:
                  print(f"[{kw}] …{t[max(0,m.start()-200):m.end()+200]}…\n")
          PY
          curl -sS -m 30 -L -A "$UA" -o hist.json "https://en.wikipedia.org/w/api.php?action=parse&page=Historical_components_of_the_Dow_Jones_Industrial_Average&prop=revid&format=json&formatversion=2" || true
          python3 -I -c 'import json; print("history revid:", json.load(open("hist.json"))["parse"]["revid"])'
      - name: NYSE 휴장일 페이지 — 날짜가 든 줄 전부
        run: |
          curl -sS -m 30 -L -A "Mozilla/5.0 (fde-lab learning project)" -o nyse.html -w "HTTP %{http_code} · %{size_download} bytes\n" "https://www.nyse.com/markets/hours-calendars" || true
          python3 -I - <<'PY'
          import re, html
          t = open("nyse.html", encoding="utf-8", errors="replace").read()
          t = re.sub(r"<script.*?</script>|<style.*?</style>", "", t, flags=re.S)
          t = re.sub(r"<[^>]+>", "\n", t); t = html.unescape(t)
          lines = [re.sub(r"\s+", " ", l).strip() for l in t.split("\n")]
          lines = [l for l in lines if l]
          print("lines", len(lines))
          for l in lines:
              if re.search(r"(Monday|Tuesday|Wednesday|Thursday|Friday|Holiday|Early Close|2026|2027|\*)", l):
                  print(l[:200])
          PY
