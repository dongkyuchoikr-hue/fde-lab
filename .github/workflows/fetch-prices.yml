name: fetch-prices

# 주 1회 공개 일별 시세를 받아(비공개 작업 폴더) 주간 통계·지난주 결과·이번 주 선정을 계산하고 docs/data/ 에 커밋한 뒤 배포합니다.
# 토 12:17 KST(금 22:17 ET, 미국 금요일 종가 뒤) 본 실행 · 일 09:47 KST 재시도 · 월 09:30 KST 마지막 확인(이미 최신이면 아무것도 하지 않음 —
# 월요일 실행은 금요일 행이 그때까지도 없으면 빨간불을 켜기 위한 것).
# 키: Settings → Secrets and variables → Actions → New repository secret → 이름 EOD_API_KEY (값은 어디에도 적지 않음). 키가 없으면 실행이 실패합니다
#     (demo 키는 벤치마크 SPY 를 주지 않아 계산할 수 없음).
# 공급자·공개 범위: docs/data/source_policy.json · 종목: docs/data/universe.json · 규칙: docs/data/rules.json
# 원본 일별 시세는 공급자 이용 조건상 공개할 수 없어 .work/ 에만 두고 커밋하지 않습니다(로그에도 가격을 찍지 않음).
# 재시도 때 한도를 아끼려고 .work/eod 를 Actions 캐시에 두며(저장소 밖 · 마지막 사용 뒤 최대 7일), 그 주가 다 끝나면(이번 주 선정 동결 + 지난주 결과 확정) 지웁니다.
# 이번 주 선정이 이미 동결된 뒤의 재시도(토요일에 지난주 결과만 보류였던 경우)는 지난주 결과만 다시 계산하고, 공개 weekly.json·picks.json 은 동결 때 그대로 둡니다.
# 같은 저장소의 다른 워크플로 실행(PR 포함)도 캐시를 읽을 수 있으니 Settings → Actions → "Require approval for all outside collaborators" 를 켜 두세요.
on:
  schedule:
    - cron: "17 3 * * 6"
    - cron: "47 0 * * 0"
    - cron: "30 0 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "계산만 하고 커밋·태그·배포는 하지 않음"
        type: boolean
        default: false
      tickers:
        description: "시험용: 쉼표 구분 종목(비우면 universe.json + 벤치마크 + 지난주 선정). 채우면 항상 dry_run 으로 동작"
        type: string
        default: ""

concurrency:
  group: fetch-prices
  cancel-in-progress: false

# 모든 run 단계를 bash -eo pipefail 로(지정하지 않으면 pipefail 없는 bash -e 라서 `plan_run.py | tee` 의 실패가 가려짐)
defaults:
  run:
    shell: bash

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 실행 계획 — 기대 기준일·종목 목록·이미 최신인지
        id: plan
        run: |
          python3 -I scripts/plan_run.py --tickers "${{ github.event.inputs.tickers }}" | tee -a "$GITHUB_OUTPUT"

      - name: 이미 최신이면 종료
        if: steps.plan.outputs.already == 'true'
        run: echo "기준일 ${{ steps.plan.outputs.as_of }} 자료가 이미 확정돼 있습니다 — 할 일 없음 (${{ steps.plan.outputs.reason }})" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 키 확인 — EOD_API_KEY Secret 이 없으면 여기서 멈춤
        if: steps.plan.outputs.already != 'true'
        env:
          EOD_API_KEY: ${{ secrets.EOD_API_KEY }}
        run: |
          if [ -z "$EOD_API_KEY" ]; then
            echo "::error::EOD_API_KEY Secret 이 없습니다 — demo 키는 벤치마크 SPY 를 주지 않아 계산할 수 없습니다. Settings → Secrets and variables → Actions 에 EOD_API_KEY 를 넣고 다시 실행하세요. 이미 커밋된 자료만 배포하려면 check-deploy 를 Run workflow 하면 됩니다."
            exit 1
          fi
          echo "키 있음(값은 출력하지 않음)"

      - name: 작업 폴더 복원 (재시도 때 한도 절약 · 캐시는 저장소 밖, 최대 7일, 그 주가 다 끝나면 삭제)
        if: steps.plan.outputs.already != 'true'
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .work/eod
          key: eod-${{ steps.plan.outputs.provider }}-${{ steps.plan.outputs.as_of }}

      - name: 시세 받기 (키는 Secret · 로그에는 날짜·행 수만 · 일부 실패(종료 코드 4)면 계속)
        if: steps.plan.outputs.already != 'true'
        env:
          EOD_API_KEY: ${{ secrets.EOD_API_KEY }}
        run: |
          python3 -I scripts/fetch_eod.py --provider "${{ steps.plan.outputs.provider }}" \
            --tickers "${{ steps.plan.outputs.tickers }}" --out .work/eod \
            --expect-last "${{ steps.plan.outputs.as_of }}" --skip-fresh --max-requests 40 --pause 3.1 \
            || test $? -eq 4

      - name: 작업 폴더 저장
        if: always() && steps.plan.outputs.already != 'true' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .work/eod
          key: eod-${{ steps.plan.outputs.provider }}-${{ steps.plan.outputs.as_of }}

      - name: 주간 통계 → 지난주 결과 → 이번 주 선정 (이번 주가 이미 동결됐으면 지난주 결과만)
        if: steps.plan.outputs.already != 'true'
        id: build
        env:
          AS_OF: ${{ steps.plan.outputs.as_of }}
          AGE_DAYS: ${{ steps.plan.outputs.age_days }}
          PREV_PICK_AS_OF: ${{ steps.plan.outputs.prev_pick_as_of }}
        run: |
          # 이번 주 선정이 이미 동결돼 있으면(토요일 실행이 선정은 동결했지만 지난주 결과가 보류였던 재시도)
          # 공개 weekly.json·picks.json 은 동결 때 그대로 두고, 새 자료로 지난주 결과만 다시 계산합니다.
          FROZEN=false; OUT=docs/data/weekly.json
          if [ -f "docs/data/picks/${AS_OF}.json" ]; then FROZEN=true; OUT=.work/weekly_public_retry.json; fi
          echo "frozen=$FROZEN" >> "$GITHUB_OUTPUT"
          set +e
          python3 -I scripts/build_weekly.py --eod .work/eod --private-out .work/weekly_full.json --out "$OUT" \
            --extra-tickers "$(python3 -I -c "import json,os,sys; p='docs/data/picks/'+sys.argv[1]+'.json'; print(','.join(x['ticker'] for x in json.load(open(p))['picks']) if os.path.exists(p) else '')" "$PREV_PICK_AS_OF")"
          rc=$?
          set -e
          if [ $rc -eq 3 ]; then
            echo "아직 게시 안 됨 — 벤치마크의 ${AS_OF} 행이 없습니다 (기준일 ${AGE_DAYS}일 전)" | tee -a "$GITHUB_STEP_SUMMARY"
            git checkout -- docs/data/weekly.json 2>/dev/null || true
            if [ "$AGE_DAYS" -gt 2 ]; then echo "::error::기준일이 2일 넘게 지났는데도 자료가 없습니다 — 휴장일 파일 또는 공급자 상태를 확인하세요"; exit 1; fi
            if [ "$AGE_DAYS" -ge 2 ]; then echo "::warning::기준일 ${AS_OF} 행이 아직 없습니다(2일째). 월요일 실행까지 없으면 빨간불이 됩니다"; fi
            echo "built=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ $rc -eq 0 ] || exit $rc
          python3 -I scripts/build_results.py --private .work/weekly_full.json
          if [ "$FROZEN" = true ]; then
            echo "이번 주(${AS_OF}) 선정은 이미 동결돼 있어 다시 계산하지 않습니다 — 지난주 결과만 갱신했습니다" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 -I scripts/build_picks.py --private .work/weekly_full.json
          fi
          PREV_STATUS=$(python3 -I -c "import json,os,sys; p='docs/data/results/'+sys.argv[1]+'.json'; print(json.load(open(p)).get('status','') if os.path.exists(p) else '')" "$PREV_PICK_AS_OF")
          if [ "$PREV_STATUS" = "보류" ]; then
            if [ "$AGE_DAYS" -ge 3 ]; then
              echo "::warning::지난주(${PREV_PICK_AS_OF}) 선정의 결과가 아직 보류입니다 — 오늘이 마지막 자동 재시도였습니다. 금요일 장 마감 전에 Actions → fetch-prices → Run workflow 로 다시 돌리지 않으면 다음 토요일에 공백으로 남습니다"
            else
              echo "::warning::지난주(${PREV_PICK_AS_OF}) 선정의 결과가 아직 보류입니다 — 선정 종목 중 기준일 자료가 없는 종목이 있어 일·월 자동 재시도가 다시 계산합니다"
            fi
          fi
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: 검사 (구조·순위 재검산·금지어·동결 파일 불변)
        if: steps.build.outputs.built == 'true'
        run: |
          python3 -I scripts/check_static.py
          python3 -I scripts/check_weekly.py docs/data/weekly.json
          python3 -I scripts/check_picks.py docs/data/picks.json
          python3 -I scripts/check_results.py
          python3 -I scripts/check_words.py docs/data
          python3 -I scripts/check_frozen.py --base HEAD
          if grep -rEl '(api_token|apikey)=[A-Za-z0-9._-]{12,}' docs/; then echo "::error::키 모양 문자열이 docs/ 에 있습니다"; exit 1; fi

      - name: 커밋·태그·푸시 (dry_run 이거나 시험용 종목이면 건너뜀)
        if: steps.build.outputs.built == 'true'
        id: commit
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ] || [ -n "${{ github.event.inputs.tickers }}" ]; then
            echo "dry_run(또는 시험용 종목) — 바뀐 파일:"; git status --short docs/data; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet -- docs/data && [ -z "$(git ls-files --others --exclude-standard docs/data)" ]; then
            echo "바뀐 데이터 없음"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          AS_OF="${{ steps.plan.outputs.as_of }}"
          STATUS=$(python3 -I -c "import json; print(json.load(open('docs/data/picks.json'))['status'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          NOTE=""; if [ "${{ steps.build.outputs.frozen }}" = "true" ]; then NOTE=" · 지난주 결과 다시 계산"; fi
          git commit -m "데이터 갱신: 주 마감 ${{ steps.plan.outputs.week_end }} (기준일 ${AS_OF} ET) · 선정 ${STATUS}${NOTE} (fetch-prices)"
          # 먼저 main 위로 옮긴 뒤 태그를 붙입니다(태그가 리베이스 전 커밋에 남아 푸시되지 않는 일이 없게)
          git pull --rebase origin main
          TAG=""
          if { [ "$STATUS" = "확정" ] || [ "$STATUS" = "선정 없음" ] || [ "$STATUS" = "지각" ]; } && ! git rev-parse -q --verify "refs/tags/data/${AS_OF}" >/dev/null; then
            TAG="data/${AS_OF}"
            git tag -a "$TAG" -m "선정 동결 — 기준일 ${AS_OF} · 상태 ${STATUS} (Actions 실행 ${{ github.run_id }})"
          fi
          git push origin HEAD:main
          if [ -n "$TAG" ]; then git push origin "refs/tags/$TAG"; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 작업 캐시 삭제 (그 주가 다 끝났을 때만 — 지난주 결과가 아직 보류면 재시도용으로 남김)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AS_OF: ${{ steps.plan.outputs.as_of }}
          KEY: eod-${{ steps.plan.outputs.provider }}-${{ steps.plan.outputs.as_of }}
        run: |
          ALREADY=$(python3 -I scripts/plan_run.py --as-of "$AS_OF" | sed -n 's/^already=//p')
          if [ "$ALREADY" != "true" ]; then
            echo "::notice::이번 주가 아직 다 끝나지 않아(보류) 재시도용 캐시를 남깁니다 — 마지막 사용 뒤 7일이면 자동으로 지워집니다"; exit 0
          fi
          gh cache delete "$KEY" --repo "${{ github.repository }}" \
            && echo "캐시 삭제됨" || echo "::notice::캐시 삭제 실패 또는 없음 — 마지막 사용 뒤 7일이면 자동으로 지워집니다"

      - name: 요약
        if: always() && steps.plan.outputs.already != 'true'
        env:
          EOD_API_KEY: ${{ secrets.EOD_API_KEY }}
        run: |
          {
            echo "### fetch-prices — 기준일 ${{ steps.plan.outputs.as_of }}"
            if [ -f .work/eod/_manifest.json ]; then python3 -I -c "import json; m=json.load(open('.work/eod/_manifest.json')); print('- 수집: 성공', len(m['tickers']), '· 건너뜀', len(m.get('skipped_fresh',[])), '· 실패', len(m['errors']), '·', ', '.join(f'{k}: {v}' for k,v in m['errors'].items())[:300])"; fi
            if [ -f docs/data/picks.json ]; then python3 -I -c "import json; p=json.load(open('docs/data/picks.json')); print('- 선정:', p['status'], '·', ', '.join(x['ticker'] for x in p['picks']), '· 통과', p['gate_summary']['passed'], '/', p['gate_summary']['M'])"; fi
            if [ "${{ steps.build.outputs.frozen }}" = "true" ]; then echo "- 이번 주 선정은 이미 동결돼 있어 지난주 결과만 다시 계산했습니다"; fi
            if [ -f docs/data/track_record.json ]; then python3 -I -c "import json; t=json.load(open('docs/data/track_record.json')); w=t['weeks'][-1] if t.get('weeks') else None; print('- 기록:', t['summary'].get('rows'), '행 · 확정', t['summary'].get('n'), ('· 마지막 행 ' + w['pick_as_of'] + ' ' + w['status']) if w else '')"; fi
            if [ "${{ steps.commit.outputs.changed }}" != "true" ]; then echo "- (위 선정·기록은 이번 실행의 작업 폴더 기준이며 커밋되지 않았을 수 있습니다)"; fi
            if [ -n "$EOD_API_KEY" ] && [ "${{ steps.plan.outputs.provider }}" = "eodhd" ]; then
              curl -sS -m 20 "https://eodhd.com/api/user?api_token=${EOD_API_KEY}&fmt=json" | python3 -I -c "import sys,json; d=json.load(sys.stdin); print('- EODHD 한도: 오늘', d.get('apiRequests'), '/', d.get('dailyRateLimit'), '· 보너스 남음', d.get('extraLimit'))" || echo "- EODHD 한도 조회 실패"
            fi
            echo "- 커밋: ${{ steps.commit.outputs.changed || 'false' }} ${{ steps.commit.outputs.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/check-deploy.yml
    with:
      sha: ${{ needs.fetch.outputs.sha }}
